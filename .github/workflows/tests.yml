name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ['3.x']
        include:
          # Oldest supported version, which newer Ubuntu images no longer provide.
          - os: ubuntu-24.04
            python: '3.8'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Run tests
        run: python -m unittest discover -s tests -v
